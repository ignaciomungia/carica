apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasSigningConfig = keystorePropertiesFile.exists()
if (hasSigningConfig) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdk 36
    namespace "caricam.caricature.photo"

    defaultConfig {
        applicationId "caricam.caricature.photo"
        minSdkVersion 23
        targetSdk 36
        versionCode 361       // comprueba antes en Play Console cuál es el real publicado
        versionName '36.1'
        multiDexEnabled true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    if (hasSigningConfig) {
        signingConfigs {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Antes estaba en false porque R8 rompía algo al ofuscar/reducir
            // (ver el comentario de LoudnessCodecController en proguard-rules.pro,
            // ya cubierto con un -keep). Google Play exige un mínimo de
            // ofuscación/reducción para no penalizar la visibilidad de la app,
            // así que lo activamos, apoyado en esa regla ya existente.
            minifyEnabled true
            // Quita de la app final los recursos (imágenes, layouts...) que el
            // propio code shrinker detecta que no se usan. No tiene relación
            // con la ofuscación del código, pero solo funciona con minifyEnabled
            // true, así que lo activamos a la vez ya que no cuesta nada extra.
            shrinkResources true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }
    productFlavors {
    }
    lintOptions {
        disable 'MissingTranslation'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.github.yalantis:ucrop:2.2.8'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    implementation 'androidx.multidex:multidex:2.0.1'
}
apply plugin: 'com.google.gms.google-services'
